services:
  # ──────────────────────────────
  # Backend (Node.js + Express)
  # ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mevocatio-backend
    # env_file carga las variables reales (DATABASE_URL, OPENAI_API_KEY,
    # EMAIL_USER, EMAIL_PASS, FRONTEND_URL) desde backend/.env, que NUNCA
    # se copia dentro de la imagen (ver backend/.dockerignore) y nunca
    # debe subirse a git (ver backend/.gitignore).
    env_file:
      - ./backend/.env
    ports:
      # "${BACKEND_PORT:-3001}" permite cambiar el puerto expuesto en el
      # HOST sin tocar el código; dentro del contenedor siempre es 3001.
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - mevocatio-network
    restart: unless-stopped

  # ──────────────────────────────
  # Frontend (Next.js)
  # ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Se pasa como build-arg (no como variable de entorno normal)
        # porque Next.js "hornea" las variables NEXT_PUBLIC_* dentro del
        # bundle de JavaScript en tiempo de build, no en tiempo de arranque.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: mevocatio-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - mevocatio-network
    restart: unless-stopped

networks:
  mevocatio-network:
    driver: bridge
